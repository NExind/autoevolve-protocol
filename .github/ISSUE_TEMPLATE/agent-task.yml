name: Agent task
description: Claim a scoped implementation task
title: "[TASK] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Use one ownership label and claim the issue before editing."
  - type: input
    id: task-id
    attributes:
      label: Work board ID
      placeholder: "CORE-01"
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owning agent
      options:
        - agent-core
        - agent-zk
        - agent-memory
        - agent-dashboard
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Exact files and boundaries
      placeholder: "Allowed: packages/core/**. Not allowed: packages/chain/**."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and test commands
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and required handoff
      placeholder: "Needs CID/public signal contract from agent-zk."
    validations:
      required: true
